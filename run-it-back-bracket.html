<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run It Back — Bracket</title>
<style>
  :root {
    --red:#D94E1F;--deep-red:#A8330D;--purple:#7B5EA7;--deep-purple:#5A3E85;
    --gold:#E8C84A;--cream:#F5E6C8;--bg:#0a0a0a;--card:#161410;--muted:#998877;--radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--cream);font-family:system-ui,sans-serif;padding:16px;min-height:100vh;}
  .subtitle{color:var(--gold);font-size:13px;text-align:center;margin-bottom:20px;}
  .tabs{display:flex;gap:4px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}
  .tab{background:var(--card);border:1px solid #333;color:var(--muted);padding:8px 18px;border-radius:var(--radius);cursor:pointer;font-size:14px;transition:all 0.15s;}
  .tab.active{background:var(--red);color:var(--cream);border-color:var(--red);}
  .tab:hover:not(.active){border-color:var(--purple);color:var(--cream);}
  .section{display:none;} .section.active{display:block;}

  .team-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto 20px;}
  .team-input-wrap{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid #333;border-radius:var(--radius);padding:8px 12px;}
  .team-num{color:var(--gold);font-size:12px;font-weight:500;min-width:22px;}
  .team-input{background:transparent;border:none;color:var(--cream);font-size:14px;outline:none;width:100%;}
  .team-input::placeholder{color:var(--muted);}
  .pool-label{color:var(--purple);font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;margin:12px 0 6px;grid-column:1/-1;border-top:1px solid #222;padding-top:12px;}
  .action-btn{display:block;margin:0 auto;background:var(--red);color:var(--cream);border:none;padding:10px 32px;border-radius:var(--radius);font-size:15px;cursor:pointer;}
  .action-btn:hover{background:var(--deep-red);}

  .pools-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
  @media(max-width:600px){.pools-grid{grid-template-columns:1fr;}.team-grid{grid-template-columns:1fr;}}
  .pool-card{background:var(--card);border:1px solid #333;border-radius:var(--radius);overflow:hidden;}
  .pool-header{background:var(--deep-purple);color:var(--cream);padding:8px 14px;font-size:14px;font-weight:500;display:flex;justify-content:space-between;align-items:center;}
  .pool-header span{color:var(--gold);font-size:12px;}
  .pool-table{width:100%;border-collapse:collapse;font-size:13px;}
  .pool-table th{color:var(--muted);padding:6px 10px;text-align:center;border-bottom:1px solid #222;font-weight:400;font-size:11px;}
  .pool-table th:first-child{text-align:left;}
  .pool-table td{padding:7px 10px;text-align:center;border-bottom:1px solid #1a1a1a;}
  .pool-table td:first-child{text-align:left;color:var(--cream);}
  .pool-table tr.leader td:first-child{color:var(--gold);}
  .pool-table tr:last-child td{border-bottom:none;}
  .rank{color:var(--muted);font-size:11px;margin-right:4px;}

  .games-container{max-width:680px;margin:0 auto;}
  .stage-label{color:var(--gold);font-size:13px;font-weight:500;margin:20px 0 10px;text-transform:uppercase;letter-spacing:0.06em;}
  .game-card{background:var(--card);border:1px solid #333;border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
  .game-header{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:#1c1916;font-size:11px;color:var(--muted);}
  .game-header .gid{color:var(--purple);font-weight:500;}
  .game-teams{display:flex;align-items:center;padding:10px 12px;gap:10px;}
  .team-slot{flex:1;}
  .team-name{font-size:14px;color:var(--cream);font-weight:500;}
  .team-name.tbd{color:var(--muted);font-style:italic;font-weight:400;}
  .team-name.winner{color:var(--gold);}
  .vs{color:var(--red);font-weight:500;font-size:13px;flex-shrink:0;}
  .score-inputs{display:flex;align-items:center;gap:6px;margin-left:10px;}
  .score-in{width:46px;background:#0a0a0a;border:1px solid #444;color:var(--cream);font-size:16px;font-weight:500;text-align:center;padding:5px;border-radius:5px;outline:none;}
  .score-in:focus{border-color:var(--red);}
  .score-dash{color:var(--muted);}
  .confirm-btn{background:var(--purple);color:var(--cream);border:none;padding:6px 14px;border-radius:5px;font-size:12px;cursor:pointer;}
  .confirm-btn:hover{background:var(--deep-purple);}
  .confirm-btn:disabled{background:#333;color:var(--muted);cursor:default;}

  .bracket-wrap{overflow-x:auto;padding-bottom:10px;}
  .b-round-label{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px;}
  .b-match{background:var(--card);border:1px solid #333;border-radius:var(--radius);overflow:hidden;}
  .b-team{padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
  .b-team:first-child{border-bottom:1px solid #222;}
  .b-team-name{color:var(--cream);}
  .b-team-name.tbd{color:var(--muted);font-style:italic;}
  .b-team-name.winner{color:var(--gold);font-weight:500;}
  .b-score{color:var(--muted);font-size:13px;min-width:20px;text-align:right;}
  .b-score.winner{color:var(--gold);}
  .champ-box{background:#0e0a04;border:1px solid var(--gold);border-radius:var(--radius);padding:16px;text-align:center;min-width:155px;}
  .champ-label{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px;}
  .champ-name{color:var(--cream);font-size:18px;font-weight:500;}
  .champ-name.tbd{color:var(--muted);font-style:italic;font-size:14px;}

  @media print{
    body{background:white;color:black;}
    .tabs,.action-btn,.confirm-btn,.score-in{display:none!important;}
    .section{display:block!important;}
    .pool-card,.game-card,.b-match{border:1px solid #ccc;}
    .pool-header{background:#7B5EA7;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
</style>
</head>
<body>

<img src="https://raw.githubusercontent.com/lilah-sciaky-45/ball-out/main/RIB-LOGO.png" alt="Run It Back" style="height:80px;display:block;margin:16px auto 10px;">
<p class="subtitle">Bracket &bull; Admin Only</p>

<div class="tabs">
  <button class="tab active" onclick="showTab('setup')">Teams</button>
  <button class="tab" onclick="showTab('pools')">Standings</button>
  <button class="tab" onclick="showTab('games')">Games</button>
  <button class="tab" onclick="showTab('bracket')">Bracket</button>
  <button class="tab" onclick="window.print()">Print</button>
</div>

<div id="tab-setup" class="section active">
  <div class="team-grid" id="team-inputs"></div>
  <button class="action-btn" onclick="startTournament()">Generate Schedule</button>
</div>

<div id="tab-pools" class="section">
  <div class="pools-grid" id="pools-display"></div>
</div>

<div id="tab-games" class="section">
  <div class="games-container" id="games-display"></div>
</div>

<div id="tab-bracket" class="section">
  <div class="bracket-wrap">
    <div id="bracket-display"></div>
  </div>
</div>

<script>
const POOL_A=[0,1,2,3], POOL_B=[4,5,6,7];
const POOL_A_PAIRS=[[0,1],[2,3],[0,2],[1,3]];
const POOL_B_PAIRS=[[4,5],[6,7],[4,6],[5,7]];
let teams=Array.from({length:8},(_,i)=>`Team ${i+1}`);
let poolGames=[], bracketGames=[], standings={A:[],B:[]}, started=false;

function buildTeamInputs(){
  const el=document.getElementById('team-inputs'); el.innerHTML='';
  [['Pool A',POOL_A],['Pool B',POOL_B]].forEach(([lbl,pool])=>{
    const d=document.createElement('div'); d.className='pool-label'; d.textContent=lbl; el.appendChild(d);
    pool.forEach(i=>{
      const w=document.createElement('div'); w.className='team-input-wrap';
      w.innerHTML=`<span class="team-num">${i+1}</span><input class="team-input" id="t${i}" value="${teams[i]}" placeholder="Team ${i+1}">`;
      el.appendChild(w);
    });
  });
}

function startTournament(){
  for(let i=0;i<8;i++) teams[i]=document.getElementById('t'+i).value||`Team ${i+1}`;
  poolGames=[...POOL_A_PAIRS,...POOL_B_PAIRS].map(([t1,t2],i)=>({id:`G${i+1}`,t1,t2,s1:null,s2:null,done:false}));
  bracketGames=[
    {id:'SF1',label:'Semifinal 1',t1:null,t2:null,s1:null,s2:null,done:false},
    {id:'SF2',label:'Semifinal 2',t1:null,t2:null,s1:null,s2:null,done:false},
    {id:'FIN',label:'Final',t1:null,t2:null,s1:null,s2:null,done:false},
  ];
  recalc(); started=true; showTab('games'); renderAll();
}

function recalc(){
  let st={};
  for(let i=0;i<8;i++) st[i]={w:0,l:0,diff:0};
  poolGames.forEach(g=>{
    if(!g.done) return;
    if(g.s1>g.s2){st[g.t1].w++;st[g.t2].l++;}
    else if(g.s2>g.s1){st[g.t2].w++;st[g.t1].l++;}
    st[g.t1].diff+=(g.s1-g.s2);
    st[g.t2].diff+=(g.s2-g.s1);
  });
  const sort=pool=>pool.map(i=>({i,...st[i]})).sort((a,b)=>b.w-a.w||b.diff-a.diff);
  standings.A=sort(POOL_A); standings.B=sort(POOL_B);
  const A=standings.A, B=standings.B;
  bracketGames[0].t1=A[0]?.i??null; bracketGames[0].t2=B[1]?.i??null;
  bracketGames[1].t1=B[0]?.i??null; bracketGames[1].t2=A[1]?.i??null;
  if(bracketGames[0].done&&bracketGames[1].done){
    bracketGames[2].t1=winner(bracketGames[0]); bracketGames[2].t2=winner(bracketGames[1]);
  }
}

function winner(g){return !g.done?null:g.s1>g.s2?g.t1:g.t2;}
function tn(i){return i===null||i===undefined?'TBD':teams[i];}
function renderAll(){renderPools();renderGames();renderBracket();}

function renderPools(){
  const el=document.getElementById('pools-display'); el.innerHTML='';
  ['A','B'].forEach(p=>{
    const c=document.createElement('div'); c.className='pool-card';
    c.innerHTML=`<div class="pool-header">Pool ${p}<span>W / L / +/-</span></div>
    <table class="pool-table"><thead><tr><th>Team</th><th>W</th><th>L</th><th>+/-</th></tr></thead>
    <tbody>${standings[p].map((s,ri)=>`<tr class="${ri<2?'leader':''}">
      <td><span class="rank">${ri+1}</span>${tn(s.i)}</td>
      <td style="color:var(--gold);font-weight:500">${s.w}</td><td>${s.l}</td>
      <td style="color:${s.diff>=0?'var(--gold)':'var(--red)'}">${s.diff>0?'+':''}${s.diff}</td>
    </tr>`).join('')}</tbody></table>`;
    el.appendChild(c);
  });
}

function renderGames(){
  const el=document.getElementById('games-display'); el.innerHTML='';
  let lbl=document.createElement('div'); lbl.className='stage-label'; lbl.textContent='Pool Play'; el.appendChild(lbl);
  poolGames.forEach(g=>{
    const pool=POOL_A.includes(g.t1)?'Pool A':'Pool B';
    el.appendChild(makeCard(g.id,pool,g.t1,g.t2,g.s1,g.s2,g.done,winner(g),(s1,s2)=>{
      g.s1=s1;g.s2=s2;g.done=true;recalc();renderAll();
    }));
  });
  let lbl2=document.createElement('div'); lbl2.className='stage-label'; lbl2.style.marginTop='24px'; lbl2.textContent='Bracket'; el.appendChild(lbl2);
  bracketGames.forEach(g=>{
    el.appendChild(makeCard(g.id,g.label,g.t1,g.t2,g.s1,g.s2,g.done,winner(g),(s1,s2)=>{
      g.s1=s1;g.s2=s2;g.done=true;
      if(g.id==='SF1'||g.id==='SF2'){bracketGames[2].t1=winner(bracketGames[0]);bracketGames[2].t2=winner(bracketGames[1]);}
      renderAll();
    }));
  });
}

function makeCard(id,lbl,t1,t2,s1,s2,done,win,onSave){
  const wrap=document.createElement('div');
  const isTbd=t1===null||t2===null;
  wrap.innerHTML=`<div class="game-card">
    <div class="game-header"><span class="gid">${id}</span><span>${lbl}</span>${done?'<span style="color:var(--gold)">Done</span>':''}</div>
    <div class="game-teams">
      <div class="team-slot"><div class="team-name ${isTbd?'tbd':''} ${done&&win===t1?'winner':''}">${tn(t1)}</div></div>
      <span class="vs">VS</span>
      <div class="team-slot" style="text-align:right"><div class="team-name ${isTbd?'tbd':''} ${done&&win===t2?'winner':''}">${tn(t2)}</div></div>
      <div class="score-inputs">
        <input class="score-in" type="number" min="0" id="s1-${id}" value="${s1!==null?s1:''}" ${done||isTbd?'disabled':''}>
        <span class="score-dash">–</span>
        <input class="score-in" type="number" min="0" id="s2-${id}" value="${s2!==null?s2:''}" ${done||isTbd?'disabled':''}>
        <button class="confirm-btn" ${done||isTbd?'disabled':''} onclick="saveGame('${id}')" id="btn-${id}">${done?'Saved':'Save'}</button>
        ${done&&!isTbd?`<button class="confirm-btn" style="background:var(--muted);margin-left:4px" onclick="editGame('${id}')">Edit</button>`:''}
      </div>
    </div>
  </div>`;
  window['_gs_'+id]=onSave;
  return wrap;
}

function editGame(id){
  const all=[...poolGames,...bracketGames];
  const g=all.find(g=>g.id===id);
  if(!g) return;
  g.done=false; g.s1=null; g.s2=null;
  recalc(); renderAll();
}

function saveGame(id){
  const s1=parseInt(document.getElementById('s1-'+id).value);
  const s2=parseInt(document.getElementById('s2-'+id).value);
  if(isNaN(s1)||isNaN(s2)) return;
  window['_gs_'+id](s1,s2);
}

function renderBracket(){
  const el=document.getElementById('bracket-display'); el.innerHTML='';
  const sf1=bracketGames[0],sf2=bracketGames[1],fin=bracketGames[2];
  const champ=winner(fin);

  el.style.cssText='display:grid;grid-template-columns:180px 40px 180px 40px 160px;grid-template-rows:auto auto auto;align-items:center;gap:0;min-width:580px;padding:10px 0;';

  const sf1el=document.createElement('div');
  sf1el.style.cssText='grid-column:1;grid-row:1;';
  sf1el.innerHTML=`<div class="b-round-label" style="text-align:left;margin-bottom:6px">Semifinal 1</div>${bMatch(sf1)}`;
  el.appendChild(sf1el);

  const con1=document.createElement('div');
  con1.style.cssText='grid-column:2;grid-row:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;';
  con1.innerHTML=`<svg width="40" height="60" style="overflow:visible"><polyline points="0,30 20,30 20,60 40,60" fill="none" stroke="#333" stroke-width="1.5"/></svg>`;
  el.appendChild(con1);

  const sf2el=document.createElement('div');
  sf2el.style.cssText='grid-column:1;grid-row:3;';
  sf2el.innerHTML=`<div class="b-round-label" style="text-align:left;margin-bottom:6px">Semifinal 2</div>${bMatch(sf2)}`;
  el.appendChild(sf2el);

  const con2=document.createElement('div');
  con2.style.cssText='grid-column:2;grid-row:3;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:100%;';
  con2.innerHTML=`<svg width="40" height="60" style="overflow:visible"><polyline points="0,30 20,30 20,0 40,0" fill="none" stroke="#333" stroke-width="1.5"/></svg>`;
  el.appendChild(con2);

  const spacer=document.createElement('div');
  spacer.style.cssText='grid-column:1;grid-row:2;height:24px;';
  el.appendChild(spacer);

  const finel=document.createElement('div');
  finel.style.cssText='grid-column:3;grid-row:1/4;display:flex;flex-direction:column;justify-content:center;';
  finel.innerHTML=`<div class="b-round-label" style="text-align:left;margin-bottom:6px">Final</div>${bMatch(fin)}`;
  el.appendChild(finel);

  const arrel=document.createElement('div');
  arrel.style.cssText='grid-column:4;grid-row:1/4;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;';
  arrel.textContent='›';
  el.appendChild(arrel);

  const champel=document.createElement('div');
  champel.style.cssText='grid-column:5;grid-row:1/4;display:flex;flex-direction:column;align-items:center;justify-content:center;';
  champel.innerHTML=`<div class="b-round-label" style="margin-bottom:8px">Champion</div>
  <div class="champ-box"><div class="champ-label">Winner</div>
  <div class="champ-name ${champ===null?'tbd':''}">${champ===null?'TBD':tn(champ)}</div></div>`;
  el.appendChild(champel);
}

function bMatch(g){
  const w=winner(g);
  return `<div class="b-match">
    <div class="b-team"><span class="b-team-name ${g.t1===null?'tbd':''} ${g.t1!==null&&w===g.t1?'winner':''}">${tn(g.t1)}</span><span class="b-score ${g.t1!==null&&w===g.t1?'winner':''}">${g.s1!==null?g.s1:''}</span></div>
    <div class="b-team"><span class="b-team-name ${g.t2===null?'tbd':''} ${g.t2!==null&&w===g.t2?'winner':''}">${tn(g.t2)}</span><span class="b-score ${g.t2!==null&&w===g.t2?'winner':''}">${g.s2!==null?g.s2:''}</span></div>
  </div>`;
}

function showTab(name){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  ['setup','pools','games','bracket'].forEach((n,i)=>{if(n===name)document.querySelectorAll('.tab')[i].classList.add('active');});
  if(started) renderAll();
}

buildTeamInputs();
</script>
</body>
</html>
