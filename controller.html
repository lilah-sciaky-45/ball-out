<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIB Controller</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0a; color:#F5E6C8; font-family:'Oswald',sans-serif; min-height:100vh; padding:16px; }
  h1 { font-size:14px; color:#D94E1F; letter-spacing:3px; text-align:center; margin-bottom:16px; }
  .section { background:#161410; border:1px solid #2a2018; border-radius:8px; padding:12px; margin-bottom:12px; }
  .section-title { font-size:10px; color:#998877; letter-spacing:2px; margin-bottom:10px; }
  .two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  label { font-size:10px; color:#998877; letter-spacing:1px; display:block; margin-bottom:4px; }
  input[type=text], input[type=number] {
    width:100%; background:#0a0a0a; border:1px solid #2a2018;
    color:#F5E6C8; padding:8px; border-radius:4px;
    font-family:'Oswald',sans-serif; font-size:13px;
  }
  .score-display { font-size:48px; font-weight:700; color:#D94E1F; text-align:center; font-variant-numeric:tabular-nums; margin:4px 0; }
  .btn-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:4px; }
  .btn { padding:10px 4px; border:none; border-radius:6px; font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; cursor:pointer; transition:transform 0.1s, background 0.1s; color:#F5E6C8; background:#2a2018; border:1px solid #3a3020; }
  .btn:active { transform:scale(0.95); }
  .btn-score { background:#D94E1F; color:#F5E6C8; border:none; }
  .btn-score:hover { background:#A8330D; }
  .btn-minus { background:#2a2018; color:#998877; border:1px solid #3a3020; }
  .btn-minus:hover { background:#3a3020; }
  .foul-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:4px; }
  .foul-val { font-size:32px; font-weight:700; color:#7B5EA7; font-variant-numeric:tabular-nums; min-width:40px; text-align:center; }
  .foul-btns { display:flex; gap:6px; }
  .btn-foul { padding:8px 14px; background:#2a2018; color:#F5E6C8; border:1px solid #3a3020; border-radius:6px; font-family:'Oswald',sans-serif; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-foul:active { transform:scale(0.95); }
  .btn-foul.plus { background:#5A3E85; color:#F5E6C8; border:none; }
  .btn-foul.plus:hover { background:#7B5EA7; }
  .clock-display { font-size:52px; font-weight:700; color:#D94E1F; text-align:center; letter-spacing:4px; font-variant-numeric:tabular-nums; }
  .clock-display.urgent { color:#E8C84A; }
  .clock-controls { display:flex; gap:8px; margin-top:8px; }
  .btn-clock { flex:1; padding:12px; border:none; border-radius:6px; font-family:'Oswald',sans-serif; font-size:11px; font-weight:700; cursor:pointer; letter-spacing:1px; }
  .btn-start { background:#D94E1F; color:#F5E6C8; }
  .btn-start:hover { background:#A8330D; }
  .btn-pause { background:#2a2018; color:#998877; border:1px solid #3a3020; }
  .btn-pause:hover { background:#3a3020; }
  .btn-reset-clock { background:#2a2018; color:#998877; border:1px solid #3a3020; }
  .btn-reset-clock:hover { background:#3a3020; }
  .clock-set { display:flex; align-items:center; gap:6px; margin-top:8px; }
  .clock-set input { width:80px; text-align:center; }
  .clock-set button { background:#2a2018; color:#F5E6C8; border:1px solid #3a3020; border-radius:4px; padding:6px 10px; font-family:'Oswald',sans-serif; font-size:11px; cursor:pointer; }
  .clock-set button:hover { background:#3a3020; }
  .btn-label { background:#2a2018; color:#E8C84A; border:1px solid #3a3020; }
  .btn-label:hover, .btn-label.active { background:#3a2800; border-color:#E8C84A55; }
  .btn-poss { flex:1; padding:10px; border:none; border-radius:6px; font-family:'Oswald',sans-serif; font-size:11px; font-weight:700; cursor:pointer; background:#2a2018; color:#998877; border:1px solid #3a3020; }
  .btn-poss:active { transform:scale(0.95); }
  .btn-poss.active-home, .btn-poss.active-guest { background:#D94E1F; color:#F5E6C8; }
  .btn-poss.active-none { background:#3a3020; color:#F5E6C8; }
  .btn-danger { width:100%; padding:12px; background:#1a0a0a; color:#D94E1F; border:1px solid #A8330D55; border-radius:6px; font-family:'Oswald',sans-serif; font-size:11px; font-weight:700; cursor:pointer; letter-spacing:2px; }
  .btn-danger:hover { background:#2a0a0a; }
</style>
</head>
<body>
<h1>⚡ RUN IT BACK — CONTROLLER</h1>

<div class="section">
  <div class="section-title">TEAM NAMES</div>
  <div class="two-col">
    <div>
      <label>HOME TEAM</label>
      <input type="text" id="homeName" placeholder="HOME" maxlength="16" oninput="save()">
    </div>
    <div>
      <label>GUEST TEAM</label>
      <input type="text" id="guestName" placeholder="GUEST" maxlength="16" oninput="save()">
    </div>
  </div>
</div>

<div class="two-col">
  <div class="section">
    <div class="section-title">HOME SCORE</div>
    <div class="score-display" id="homeScoreDisp">0</div>
    <div class="btn-row">
      <button class="btn btn-score" onclick="addScore('home',1)">+1</button>
      <button class="btn btn-score" onclick="addScore('home',2)">+2</button>
      <button class="btn btn-score" onclick="addScore('home',3)">+3</button>
    </div>
    <button class="btn btn-minus" style="width:100%;margin-top:6px;" onclick="addScore('home',-1)">−1</button>
    <div class="foul-row" style="margin-top:10px;">
      <div>
        <div style="font-size:9px;color:#998877;letter-spacing:1px;">FOULS</div>
        <div class="foul-val" id="homeFoulsDisp">0</div>
      </div>
      <div class="foul-btns">
        <button class="btn-foul" onclick="addFouls('home',-1)">−</button>
        <button class="btn-foul plus" onclick="addFouls('home',1)">+</button>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">GUEST SCORE</div>
    <div class="score-display" id="guestScoreDisp">0</div>
    <div class="btn-row">
      <button class="btn btn-score" onclick="addScore('guest',1)">+1</button>
      <button class="btn btn-score" onclick="addScore('guest',2)">+2</button>
      <button class="btn btn-score" onclick="addScore('guest',3)">+3</button>
    </div>
    <button class="btn btn-minus" style="width:100%;margin-top:6px;" onclick="addScore('guest',-1)">−1</button>
    <div class="foul-row" style="margin-top:10px;">
      <div>
        <div style="font-size:9px;color:#998877;letter-spacing:1px;">FOULS</div>
        <div class="foul-val" id="guestFoulsDisp">0</div>
      </div>
      <div class="foul-btns">
        <button class="btn-foul" onclick="addFouls('guest',-1)">−</button>
        <button class="btn-foul plus" onclick="addFouls('guest',1)">+</button>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">GAME CLOCK</div>
  <div class="clock-display" id="clockDisp">10:00</div>
  <div class="clock-controls">
    <button class="btn-clock btn-start" onclick="startClock()">START</button>
    <button class="btn-clock btn-pause" onclick="stopClock()">PAUSE</button>
    <button class="btn-clock btn-reset-clock" onclick="resetClock()">RESET</button>
  </div>
  <div class="clock-set">
    <label style="margin:0;color:#998877;">SET (MM:SS):</label>
    <input type="text" id="clockInput" placeholder="10:00" maxlength="5" style="width:80px;text-align:center;" onkeydown="if(event.key==='Enter')setClockFromInput()">
    <button onclick="setClockFromInput()">SET</button>
  </div>
</div>

<div class="section">
  <div class="section-title">GAME LABEL</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
    <button class="btn btn-label" onclick="setLabel('')">NONE</button>
    <button class="btn btn-label" onclick="setLabel('POOL PLAY')">POOL PLAY</button>
    <button class="btn btn-label" onclick="setLabel('SEMI FINALS')">SEMI FINALS</button>
    <button class="btn btn-label" onclick="setLabel('FINALS')">FINALS</button>
  </div>
</div>

<div class="section">
  <div class="section-title">NEXT UP</div>
  <input type="text" id="nextUpInput" placeholder="e.g. HAWKS vs BULLS" maxlength="40" oninput="setNextUp()">
</div>

<div class="section">
  <div class="section-title">POSSESSION ARROW</div>
  <div style="display:flex;gap:8px;">
    <button class="btn-poss" id="possHome" onclick="setPoss('home')">◀ HOME</button>
    <button class="btn-poss" id="possNone" onclick="setPoss('none')">NONE</button>
    <button class="btn-poss" id="possGuest" onclick="setPoss('guest')">GUEST ▶</button>
  </div>
</div>

<div class="section">
  <button class="btn-danger" onclick="resetGame()">⚠ RESET ENTIRE GAME</button>
</div>

<script>
let state = {
  homeName:'', guestName:'',
  homeScore:0, guestScore:0,
  homeFouls:0, guestFouls:0,
  clockSecs:600, clockRunning:false,
  possession:'none', gameLabel:'', nextUp:''
};
let ticker = null;

function load() {
  try {
    const d = JSON.parse(localStorage.getItem('rib_scoreboard')||'{}');
    if (Object.keys(d).length) state = { ...state, ...d };
  } catch(e) {}
  render();
}

function save() {
  state.homeName = document.getElementById('homeName').value;
  state.guestName = document.getElementById('guestName').value;
  localStorage.setItem('rib_scoreboard', JSON.stringify(state));
  render();
}

function render() {
  document.getElementById('homeName').value = state.homeName;
  document.getElementById('guestName').value = state.guestName;
  document.getElementById('homeScoreDisp').textContent = state.homeScore;
  document.getElementById('guestScoreDisp').textContent = state.guestScore;
  document.getElementById('homeFoulsDisp').textContent = state.homeFouls;
  document.getElementById('guestFoulsDisp').textContent = state.guestFouls;
  document.getElementById('nextUpInput').value = state.nextUp||'';
  updateClockDisplay();
  updatePossButtons();
  updateLabelButtons();
}

function fmt(s) {
  const m=Math.floor(s/60), sec=s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function updateClockDisplay() {
  const el = document.getElementById('clockDisp');
  el.textContent = fmt(state.clockSecs);
  el.className = 'clock-display'+(state.clockSecs<=30&&state.clockRunning?' urgent':'');
}

function addScore(team, pts) {
  const key = team+'Score';
  state[key] = Math.max(0, state[key]+pts);
  save();
}

function addFouls(team, n) {
  const key = team+'Fouls';
  state[key] = Math.max(0, state[key]+n);
  save();
}

function startClock() {
  if (ticker) return;
  state.clockRunning = true;
  save();
  ticker = setInterval(() => {
    if (state.clockSecs <= 0) { stopClock(); return; }
    state.clockSecs--;
    localStorage.setItem('rib_scoreboard', JSON.stringify(state));
    updateClockDisplay();
  }, 1000);
}

function stopClock() {
  clearInterval(ticker); ticker=null;
  state.clockRunning = false;
  save();
}

function resetClock() {
  stopClock();
  state.clockSecs = 600;
  save();
}

function setClockFromInput() {
  stopClock();
  const val = document.getElementById('clockInput').value.trim();
  const parts = val.split(':');
  let secs = 0;
  if (parts.length===2) secs=(parseInt(parts[0])||0)*60+(parseInt(parts[1])||0);
  else secs=parseInt(parts[0])||0;
  state.clockSecs = Math.max(0, secs);
  save();
}

function setLabel(val) {
  state.gameLabel = val;
  save();
}

function updateLabelButtons() {
  document.querySelectorAll('.btn-label').forEach(b => {
    const v = b.getAttribute('onclick').match(/'([^']*)'/)?.[1]??'';
    b.classList.toggle('active', v===state.gameLabel);
  });
}

function setNextUp() {
  state.nextUp = document.getElementById('nextUpInput').value;
  save();
}

function setPoss(val) {
  state.possession = val;
  save();
}

function updatePossButtons() {
  ['home','none','guest'].forEach(v => {
    const el = document.getElementById('poss'+v.charAt(0).toUpperCase()+v.slice(1));
    if(el) el.className = 'btn-poss'+(state.possession===v?' active-'+v:'');
  });
}

function resetGame() {
  if (!confirm('Reset entire game? This cannot be undone.')) return;
  stopClock();
  state = { ...state, homeScore:0, guestScore:0, homeFouls:0, guestFouls:0,
    clockSecs:600, clockRunning:false, possession:'none' };
  save();
}

load();
</script>
</body>
</html>
